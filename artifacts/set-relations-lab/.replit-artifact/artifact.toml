kind = "web"
previewPath = "/"
title = "Set Relations Lab"
description = "An interactive Discrete Mathematical Structures lesson that teaches how relations are formed between distinct sets, how their properties are tested, and how the same structure appears in relational databases."
version = "1.0.0"
id = "artifacts/set-relations-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22353

[services.development]
run = "pnpm --filter @workspace/set-relations-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/set-relations-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/set-relations-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22353"
BASE_PATH = "/"
